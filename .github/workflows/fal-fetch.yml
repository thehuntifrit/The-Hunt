
name: Fal Data Fetch

on:
  schedule:
    - cron: "50 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch Faloop data
        run: node scripts/fetch-faloop.js

      - name: Extract Ifrit data
        run: node scripts/extract-ifrit.js

      - name: Upload JSON files
        uses: actions/upload-artifact@v4
        with:
          name: faloop-data
          path: |
            faloop-output/
            ifrit-kills.json
          retention-days: 30
          if-no-files-found: error

      - name: Sync Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/sync-firestore.js
