どの項目も、現在の規模(10人、無料枠)に合わせて優先度をつけて整理しました。コードは**設計の骨子**で、実装前に確認を取りたいので、ファイルの変更はまだしていません。

## 1. 認証の強制化とルールの検証(最優先)

### 追加で見つかった穴
自己紹介欄の検証コードは公開ページに表示されます。コードがユーザーに紐付いていないと、他人のページに載っているコードをそのままコピーして、別のアカウントで認証を通せます。なので、**コードはuidから計算して、そのuidでしか通らないようにする**必要があります。

### 全体の流れ

| 段階 | 現状 | 変更後 |
|---|---|---|
| コード発行 | クライアントが生成(`modal.ts`は未確認) | WorkerがuidからHMACで計算して返す |
| 検証 | クライアントがHTMLを受け取って判定 | **Worker内で自己紹介文を確認** |
| 検証済みの印 | `users`に本人が書く(偽造可能) | Workerが**カスタムクレーム**を付与(`verified`、`lid`、`cname`) |
| 書き込み権限 | `users`の存在を`get()`で確認 | ルールが`request.auth.token.verified`を見る |

カスタムクレームだけで足りるので、`users`コレクションは不要になります。`getUserData`は、同じ関数名のままトークンのクレームを読む実装に差し替えられるため、`app.ts`は変更不要です。

### 事前準備(Google Cloud側)
- サービスアカウントを**新規作成**します。付与する権限は「Firebase Authentication 管理者」だけにします。Firebaseの既定の管理者鍵は流用しません。
- 秘密鍵JSONは`wrangler secret put`で登録します(`SA_EMAIL`、`SA_PRIVATE_KEY`、`HUNT_SECRET`)。
- 鍵ファイルはリポジトリに入れません。

### Worker側の骨子

```js
// verifyFirebaseToken の最後に `return payload;` を追加(uidは payload.sub)

async function hmacCode(secret, uid) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret),
    { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = new Uint8Array(await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(uid)));
  return 'HUNT-' + [...sig.slice(0, 6)].map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
}

const b64u = (s) => btoa(s).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');

async function getAccessToken(env) {
  const now = Math.floor(Date.now() / 1000);
  const unsigned = b64u(JSON.stringify({ alg: 'RS256', typ: 'JWT' })) + '.' + b64u(JSON.stringify({
    iss: env.SA_EMAIL, scope: 'https://www.googleapis.com/auth/identitytoolkit',
    aud: 'https://oauth2.googleapis.com/token', iat: now, exp: now + 3600
  }));
  const der = Uint8Array.from(atob(env.SA_PRIVATE_KEY.replace(/-----[^-]+-----/g, '').replace(/\s/g, '')), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('pkcs8', der, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
  const sig = new Uint8Array(await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, new TextEncoder().encode(unsigned)));
  const r = await fetch('https://oauth2.googleapis.com/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
      assertion: unsigned + '.' + b64u(String.fromCharCode(...sig))
    })
  });
  if (!r.ok) throw new Error('token');
  return (await r.json()).access_token;
}

async function setClaims(env, uid, claims) {
  const at = await getAccessToken(env);
  const r = await fetch('https://identitytoolkit.googleapis.com/v1/projects/the-hunt-ifrit/accounts:update', {
    method: 'POST',
    headers: { Authorization: `Bearer ${at}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ localId: uid, customAttributes: JSON.stringify(claims) })
  });
  if (!r.ok) throw new Error('claims');
}
```

エンドポイントは2つにします。
- `GET /code`は、トークンからuidを取り、`hmacCode`の結果を返します。
- `POST /verify`は、`{lodestoneId}`を受け取ります。Lodestoneを取得して、自己紹介欄に`hmacCode(uid)`が含まれるかを**Worker内で**判定します。一致したら`setClaims(env, uid, {verified:true, lid, cname})`を実行し、`{success, characterName}`だけを返します。**HTML全体はクライアントに返しません**(汎用プロキシでなくなります)。

`accounts:update`のエンドポイントとスコープは、手元で動作確認が必要です。

### クライアント側の変更
- `verifyLodestoneCharacter`は`/verify`を呼び、成功後に`await auth.currentUser.getIdToken(true)`でクレームを取り込みます。
- `getUserData`は`getIdTokenResult()`のクレームから`{lodestone_id, character_name}`を返す実装に差し替えます。
- `registerUserToFirestore`は不要になります。
- `modal.ts`のコード表示は`/code`の値を使う形になります。**`modal.ts`は未確認なので、見せてください。**

### Firestoreルール(クレーム方式)

```
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function verified() {
      return request.auth != null && request.auth.token.verified == true;
    }

    match /users/{userId} {
      allow read, write: if false;
    }

    match /mob_status/{docId} {
      allow read: if true;
      allow create, delete: if false;
      allow update: if verified()
        && docId in ['s_latest', 'a_latest', 'f_latest']
        && request.resource.data.diff(resource.data).affectedKeys().size() == 1
        && request.resource.data.size() < 300;
    }

    match /mob_locations/{docId} {
      allow read: if true;
      allow delete: if false;
      allow create: if verified() && docId.size() < 60 && request.resource.data.size() <= 2;
      allow update: if verified()
        && request.resource.data.diff(resource.data).affectedKeys().size() <= 2
        && request.resource.data.size() < 400;
    }

    match /shared_data/maintenance {
      allow read: if true;
      allow write: if false;
    }

    match /shared_data/memo {
      allow read: if true;
      allow create, delete: if false;
      allow update: if verified()
        && request.resource.data.diff(resource.data).affectedKeys().size() == 1
        && request.resource.data.size() < 300;
    }
  }
}
```

`affectedKeys().size() <= 2`は、スポーン操作が`culled_at`と`reporter_id`の2フィールドを書くためです。`create`を禁止しているドキュメントは、事前に存在している必要があります。

### ルールでできることと、できないこと
これらのドキュメントは、モブ番号などの**動的なキー**を持っています。ルール言語ではそのキーを取り出して中身を検証できないため、次の項目はルールでは検証できません。
- 時刻の範囲、型の検証
- `reporter_id`が自分のIDと一致するかの検証
- メモの文字数制限(30文字)

ルールで防げるのは、「検証済みユーザーだけが」「1回につき1モブだけ」「想定外の巨大ドキュメントにならない形で」書き込める、という範囲までです。

完全に検証したい場合の選択肢は2つあります。
- **A. 書き込みもWorker経由にする。** ルールは書き込み禁止にして、Workerが検証してからサービスアカウントで書きます。`reporter_id`はクレームの`lid`で固定でき、`prev_kill_time`もサーバー側で正しく決まります。Workerの無料枠(1日10万リクエスト)でも10人なら足ります。変更点は`submitReport`、`submitMemo`、`toggleCrushStatus`とWorkerの3関数です。
- **B. ドキュメントをモブごとに分ける。** フィールド名が固定になるのでルールで検証できますが、購読・書き込み・移行の変更が大きくなります。

おすすめは、**まず1(クレーム+上のルール)だけ入れる**ことです。これで「Lodestoneキャラを持たない人が書ける」という穴は塞がります。残るのは、検証済みの本人が悪意を持った場合だけです。10人規模なら許容できる水準で、実際に荒らされたらAに進めば十分です。

## 2. 「1ドキュメント全送信は回避不能では?」について

ご指摘の通りです。ほぼ回避できません。ただ、重要なのはそこではありません。

- Firestoreの課金は「ドキュメントの読み取り回数」で、サイズでは決まりません。リスナーは変更のたびにドキュメント全体を受け取りますが、課金は**変更1回につき接続者1人あたり1読み取り**です。
- モブごとに分けても、読み取り回数はあまり減りません。変更されたドキュメントだけが配信されるので多少は減りますが、10人なら誤差です。**先ほど挙げた「モブごとに分ける」は、枠対策としては効果が小さい**ので、取り下げます。分ける利点は、ルールで検証しやすくなる点です。
- 枠が溢れるシナリオは、悪意のある書き込みの連打です。たとえば1日5,000回書かれると、10人が購読していて約5万読み取りになり、無料枠(1日5万)に届きます。
- つまり**防ぐべきは「誰でも書ける状態」であって、ドキュメント設計ではありません。** 1の認証強制化が、そのまま枠対策になります。

あわせて次を設定しておくと安心です。
- Google Cloudの予算アラート(無料枠超過の検知)
- Firebaseコンソールの使用量タブを、たまに見る

## 3. App Checkの確認手順

Firebaseコンソールの「構築」にある「App Check」で見ます。UIの文言は多少異なる場合があります。

1. **「アプリ」タブ**で、WebアプリがreCAPTCHA Enterpriseで登録済みか確認します。コード内のサイトキーが公開されているのは仕様なので問題ありません。
2. **「API」タブ**で、Cloud Firestoreの状態を見ます。「適用済み」になっていなければ、現状は**保護されていません**。Authenticationが一覧に出る場合は、そちらも同様です。
3. 適用前に、各APIの**指標**を数日見ます。「確認済みのリクエスト」がほぼ100%なら、適用して安全です。「未確認」が多いと、適用した瞬間に正規ユーザーまで弾かれます。
4. 適用後は、指標に「拒否されたリクエスト」が出ていれば機能している証拠です。

補足は次の通りです。
- reCAPTCHA Enterpriseには無料枠があります(月1万回程度。現在の条件は要確認)。10人なら問題ありません。
- 開発時の`localhost`は、コード内の`DEBUG_TOKEN`で対応済みです。コンソールに出力されるデバッグトークンを、App Checkのアプリ設定に登録する必要があります。
- App Checkは万能ではなく、「公開APIキーを使った外部スクリプトからの直接アクセス」を弾くための仕組みです。

### APIキーの制限(Google Cloud)
「APIとサービス」→「認証情報」で、Firebaseが自動作成したブラウザキーを開きます。
- **アプリケーションの制限**は、HTTPリファラーにします。`https://thehuntifrit.github.io/*`、`https://the-hunt-ifrit.firebaseapp.com/*`、`https://the-hunt-ifrit.web.app/*`を登録し、ローカル確認用には`http://localhost:*/*`を追加します。
- **APIの制限**では、`Identity Toolkit API`、`Token Service API`、`Cloud Firestore API`、`Firebase App Check API`を許可します。動かないものがあれば、エラーメッセージのAPI名を足します。

変更後は、必ず実機で動作確認してください。リファラーは偽装できるので、App Checkとの併用が前提です。

## 4. Workerの無制限プロキシ対策

1つ目は、**HTML全体を返さない**ことです(上の`/verify`で解決)。
2つ目は、Workerで**App Checkトークンを検証**することです。クライアントが`X-Firebase-AppCheck`ヘッダーを付け、Workerが`https://firebaseappcheck.googleapis.com/v1/jwks`の公開鍵で署名を検証します。ブラウザ外のスクリプトを、ほぼ止められます。
3つ目は、**uidごとの回数制限**です。1時間に10回までなどにします。
- CloudflareのRate Limitingバインディングが使えるか(プラン要件、要確認)を調べます。
- 使えなければ、Worker内メモリの簡易制限(isolateごと、ベストエフォート)で割り切ります。
4つ目は、**検証済みなら即返す**ことです。クレームが既にあるuidはLodestoneを叩きません。
5つ目は、**上流のタイムアウト**です。`AbortSignal.timeout(8000)`を入れます。
6つ目は、**公開鍵の再取得**です。`kid`が見つからないとき、1回だけ強制再取得します(鍵ローテーション対策)。
7つ目は、CORSの細部の修正です。`Allow-Headers`に`Content-Type`と`X-Firebase-AppCheck`を追加します。許可外のOriginには403を返します。`Vary: Origin`も付けます。

## 5. メモのXSS確認

`mobCard.ts`は未確認なので、次の確認をお願いします。

- `innerHTML`、`insertAdjacentHTML`、テンプレートリテラルでHTMLを組み立てている箇所を検索します。
- そこに`memo_text`、`character_name`、`reporter_id`などの外部由来の値が入っていないか確認します。入っていれば`textContent`に変えるか、`escapeHtml`を通します。
- `app.ts`は、メモは`textContent`で表示されているので問題ありません。

1点、セキュリティではなく表示の不具合を見つけました。`renderMaintenanceStatus`で`escapeHtml(telopMsg)`の後に`createTextNode`を使っているので、`&`などが`&amp;`のまま表示されます。また、エスケープ後に`<br>`で分割しているため、`<br>`による改行は効きません(`//`は有効です)。今回は直していません。

補強として、`index.html`に`Content-Security-Policy`のmetaを入れる手もあります。ただし、gstatic、reCAPTCHAなどの許可が必要で、調整に手間がかかります。優先度は低めです。

## 6. 私が入れた修正の見直し

**`listenWithRetry`:** 現状は恒久的なエラーでも30秒間隔で再試行を続けます。次のように変更したいと考えています。

```ts
function listenWithRetry(
    attach: (onOk: () => void, onError: (err: any) => void) => () => void
): () => void {
    let stopped = false;
    let attempt = 0;
    let retryTimer: any = null;
    let unsub: (() => void) | null = null;
    const MAX_ATTEMPTS = 8;

    const start = () => {
        if (stopped) return;
        unsub = attach(
            () => { attempt = 0; },
            (err) => {
                if (unsub) { try { unsub(); } catch (e) { } unsub = null; }
                if (stopped) return;

                attempt++;
                if (attempt > MAX_ATTEMPTS) {
                    handleAppError(err, "サーバー接続に失敗しました。ページを再読み込みしてください", true);
                    return;
                }
                // 枠の枯渇は長めに待つ。ジッターで再試行の集中を避ける
                const base = err?.code === "resource-exhausted" ? 60000 : 1000;
                const delay = Math.min(300000, base * 2 ** (attempt - 1)) * (0.5 + Math.random());
                retryTimer = setTimeout(start, delay);
            }
        );
    };
    start();

    return () => {
        stopped = true;
        clearTimeout(retryTimer);
        if (unsub) unsub();
    };
}
```

- 最大8回で諦めて、ユーザーに再読み込みを促します。
- ジッターで再試行のタイミングを散らします。
- 枠の枯渇は待ち時間を長くします。

**非表示からの復帰:** `RESUME_REFRESH_THRESHOLD_MS`を`30000`から`300000`(5分)に変えることを提案します。短い離席で毎回全ドキュメントを再読み込みすると、無駄な読み取りが増えるためです。ただし、5分未満の放置で更新漏れが起きる可能性は残ります。その場合は、Firestore SDKの自動再接続に任せることになります。

## 進め方の確認

次の順で進めたいと考えていますが、どこまで進めますか。

1. **Workerの改修**(`/code`と`/verify`、クレーム付与、App Check検証)と、`server.ts`の認証まわり
2. **ルールの差し替え**
3. **`listenWithRetry`の更新**と、復帰閾値の変更
4. App Checkの適用とAPIキー制限(コンソール作業のため、こちらの手順に沿って進めてもらう形になります)

1と2は**同時に切り替える**必要があります。切り替えの瞬間から、既存の認証済みユーザーは全員、再度のLodestone認証が必要になります。10人なら現実的ですが、事前に告知しておくのが安全です。

ファイルの変更に進む前に、`modal.ts`と`mobCard.ts`を見せてもらえますか。